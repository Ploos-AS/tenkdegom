name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build Astro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The repository has no package-lock.json yet.
      # Switch to npm ci (and npm cache) once a lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type and Astro checks
        run: npm run check

      - name: Run content and privacy regression tests
        run: node --test tests/*.test.mjs

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |\n          test -f dist/index.html\n          test -f dist/sitemap.xml\n          test -f dist/robots.txt\n          grep -q 'https://tenkdegom.no/laer/' dist/sitemap.xml\n          grep -q 'Sitemap: https://tenkdegom.no/sitemap.xml' dist/robots.txt

      # Deployment will be configured separately after selecting the VPS.
